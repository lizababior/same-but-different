<!doctype html>
<!--
  PROTOTYPE, throwaway. v4: v3's layout (controls under each avatar, comparison in the middle),
  restyled in the spirit of Notion Faces / notion-avatar.app: white page, black ink, thick
  outlines, rounded type, line-art avatars. One accent: a yellow highlighter for differences.
  "Doors" were a metaphor, so the middle is now plain life areas with meters.
  Earlier: v1-three-variants · v2-taste-rejected · v3-layout (same folder).
  ALL NUMBERS ARE PLACEHOLDERS OR FROM MEMORY. Check each fact against its source before reuse.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Same But Different</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --bg: #FFFFFF; --ink: #111111; --muted: #6B6B6B; --line: #E6E6E6; --soft: #F5F5F4;
    --mark: #FFE45C; --mark-ink: #111111;
    --shirt-a: #FFFFFF; --shirt-b: #DADADA; --hijab: #5B6B8C; --kippah: #2F3D57; --avatar-bg: #FFFFFF;
    --radius: 12px; --radius-lg: 18px; --pill: 9999px;
    --font: "Quicksand", system-ui, sans-serif;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --dur-fast: 150ms; --dur: 200ms;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212; --ink: #F2F2F2; --muted: #9A9A9A; --line: #2A2A2A; --soft: #1C1C1C;
      --avatar-bg: #F2F2F2;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121212; --ink: #F2F2F2; --muted: #9A9A9A; --line: #2A2A2A; --soft: #1C1C1C;
    --avatar-bg: #F2F2F2;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 500 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  svg.lucide { width: 18px; height: 18px; stroke-width: 2; flex: none; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  mark { background: var(--mark); color: var(--mark-ink); padding: 0 4px; border-radius: 4px; }

  .page { max-width: 1280px; margin: 0 auto; padding: 24px 20px 48px; }

  /* top row */
  .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 24px; }
  .top h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
  .top .note { font-size: 13px; color: var(--muted); }
  .diffbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .diffbar .msg { margin-right: 4px; }

  /* buttons: outlined pills */
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 16px; border-radius: var(--pill); border: 2px solid var(--ink); background: var(--bg); font-weight: 600; font-size: 13px; transition: transform var(--dur-fast) var(--ease-out), background var(--dur-fast); }
  .btn svg.lucide { width: 16px; height: 16px; }
  .btn:hover { background: var(--soft); }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .3; cursor: not-allowed; transform: none; }

  /* layout */
  .mirror { display: grid; grid-template-columns: 1fr 360px 1fr; gap: 24px; align-items: start; }

  /* person */
  .side { padding: 0 4px; }
  .who { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  .who .frame { width: 96px; height: 96px; background: var(--avatar-bg); border: 2px solid var(--ink); border-radius: var(--radius-lg); display: grid; place-items: center; overflow: hidden; flex: none; }
  .who .name { font-size: 18px; font-weight: 700; }
  .who .sub { font-size: 13px; color: var(--muted); }
  .group { padding: 8px 0; }
  .group h4 { margin: 0 0 6px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
  .group h4 span { font-weight: 500; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { height: 32px; padding: 0 14px; border-radius: var(--pill); border: 2px solid var(--line); background: var(--bg); font-weight: 600; font-size: 13px; transition: transform var(--dur-fast) var(--ease-out), border-color var(--dur-fast); }
  .chip:hover { border-color: var(--ink); }
  .chip:active { transform: scale(.97); }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  /* a trait the other person doesn't share: highlighter */
  .chip.on.unshared { background: var(--mark); color: var(--mark-ink); border-color: var(--ink); }
  .chip.unshared:not(.on) { border-style: dashed; border-color: var(--ink); }
  .swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink); padding: 0; transition: transform var(--dur-fast) var(--ease-out); }
  .swatch:active { transform: scale(.92); }
  .swatch.on { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ink); }

  /* life areas */
  .center { position: sticky; top: 16px; }
  .areas { border: 2px solid var(--ink); border-radius: var(--radius-lg); padding: 8px; display: flex; flex-direction: column; gap: 2px; }
  .areas-head { display: grid; grid-template-columns: 1fr auto 1fr; font-size: 12px; font-weight: 700; color: var(--muted); padding: 6px 10px 4px; }
  .areas-head span:last-child { text-align: right; }
  .area { width: 100%; text-align: left; background: none; border: 2px solid transparent; border-radius: var(--radius); padding: 8px 10px; display: grid; gap: 6px; transition: background var(--dur-fast); }
  .area:hover { background: var(--soft); }
  .area.sel { background: var(--soft); border-color: var(--ink); }
  .area .row1 { display: flex; align-items: center; gap: 8px; }
  .area .lbl { font-weight: 700; flex: 1; }
  .delta { font-size: 13px; font-weight: 700; color: var(--muted); }
  .fly { display: grid; grid-template-columns: 28px 1fr 1fr 28px; gap: 4px; align-items: center; }
  .fly .v { font-size: 12px; font-weight: 600; color: var(--muted); }
  .fly .v.r { text-align: right; }
  .track { height: 12px; border: 2px solid var(--ink); border-radius: var(--pill); position: relative; overflow: hidden; }
  .track i { position: absolute; top: 0; bottom: 0; background: var(--ink); transition: width var(--dur) var(--ease-out); }
  .track.l i { right: 0; } .track.r i { left: 0; }
  .track.nodata { border-style: dashed; }

  /* facts */
  .why { margin-top: 14px; padding: 0 4px; }
  .why h4 { margin: 0 0 2px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .why .hint { font-size: 13px; color: var(--muted); text-align: center; margin: 8px 0; }
  .fact { padding: 10px 0; border-top: 2px solid var(--line); }
  .fact:first-of-type { border-top: 0; }
  .fact .meta { font-size: 12px; font-weight: 700; color: var(--muted); }
  .fact p { margin: 2px 0 4px; max-width: 65ch; font-weight: 600; }
  .fact.nodata p { color: var(--muted); font-style: italic; }
  .fact .src { font-size: 12px; color: var(--muted); }
  .all { margin-top: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  .all h3 { margin: 0 0 4px; font-size: 16px; font-weight: 700; display: flex; justify-content: space-between; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
  .empty { padding: 12px 0; color: var(--muted); }
  .footnote { margin-top: 40px; color: var(--muted); font-size: 12px; max-width: 70ch; }

  @media (max-width: 1000px) { .mirror { grid-template-columns: 1fr 1fr; } .center { grid-column: 1 / -1; grid-row: 1; position: static; } }
  @media (max-width: 640px) { .mirror, .all { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="page" id="app"></div>
<script>
/* ============ attribute model ============ */
const SKINS = ['#f6d7c3', '#eac0a0', '#d39b72', '#a86f48', '#7a4a2c', '#4b2e1c'];
const GROUPS = [
  { key: 'race', label: 'Race / ethnicity', multi: false, opts: [['asian', 'Asian'], ['black', 'Black'], ['hispanic', 'Hispanic / Latine'], ['native', 'Native American'], ['pi', 'Pacific Islander'], ['white', 'White'], ['multi', 'Multiracial']] },
  { key: 'gender', label: 'Gender', multi: false, opts: [['woman', 'Woman'], ['man', 'Man'], ['nonbinary', 'Nonbinary']] },
  { key: 'age', label: 'Age', multi: false, opts: [['20s', '20s'], ['40s', '40s'], ['60s', '60s']] },
  { key: 'ability', label: 'Ability', multi: true, opts: [['wheelchair', 'Wheelchair'], ['blind', 'White cane'], ['deaf', 'Hearing aid']] },
  { key: 'faith', label: 'Religion', multi: false, opts: [['muslim', 'Hijab'], ['jewish', 'Kippah']] },
  { key: 'orient', label: 'Sexual orientation', multi: false, opts: [['lgbtq', 'LGBTQ+']] },
  { key: 'class', label: 'Class / education', multi: true, opts: [['firstgen', 'First-gen student'], ['pell', 'Low income (Pell)']] },
];
const blank = () => ({ skin: 2, race: null, gender: null, age: '20s', ability: [], faith: null, orient: null, class: [] });

function tagsOf(s) {
  const t = new Set();
  t.add(s.skin <= 1 ? 'skin:light' : s.skin >= 4 ? 'skin:dark' : 'skin:mid');
  for (const g of GROUPS) {
    const v = s[g.key];
    if (g.multi) v.forEach(x => t.add(`${g.key}:${x}`));
    else if (v) t.add(`${g.key}:${v}`);
  }
  if (s.ability.length) t.add('disabled');
  return t;
}
const prettyTag = t => {
  if (t === 'disabled') return 'disabled';
  const [k, v] = t.split(':');
  if (k === 'skin') return `${v} skin`;
  return GROUPS.find(g => g.key === k)?.opts.find(o => o[0] === v)?.[1] || t;
};

/* ============ life areas + facts (PLACEHOLDER: from memory, verify each) ============ */
const AREAS = [
  ['hired', 'Getting hired', 'briefcase'], ['promoted', 'Getting promoted', 'trending-up'], ['paid', 'Equal pay', 'wallet'],
  ['loan', 'Getting a loan', 'landmark'], ['care', 'Quality health care', 'stethoscope'], ['ai', 'Recognized by AI', 'scan-face'],
];
const FACTS = [
  { tags: ['race:black'], area: 'hired', eff: .67, text: 'In a field experiment, identical résumés with Black-sounding names got about a third fewer callbacks than ones with white-sounding names.', src: 'Bertrand & Mullainathan, 2004' },
  { tags: ['race:white'], area: 'hired', eff: 1.15, text: 'In the same experiment, white-sounding names got about 50% more callbacks for identical résumés.', src: 'Bertrand & Mullainathan, 2004' },
  { tags: ['gender:woman'], area: 'promoted', eff: .75, text: 'Women hold roughly 1 in 10 Fortune 500 CEO seats.', src: 'Fortune, 2024' },
  { tags: ['gender:man'], area: 'promoted', eff: 1.2, text: 'Men hold roughly 9 in 10 Fortune 500 CEO seats.', src: 'Fortune, 2024' },
  { tags: ['gender:woman'], area: 'paid', eff: .84, text: 'Women working full-time earn about 84 cents for every dollar men earn.', src: 'US Census Bureau, 2023' },
  { tags: ['gender:woman', 'race:black'], area: 'paid', eff: .67, text: 'Black women earn about 67 cents for every dollar white non-Hispanic men earn, a bigger gap than gender or race alone.', src: 'National Women’s Law Center, 2023' },
  { tags: ['gender:woman', 'race:hispanic'], area: 'paid', eff: .55, text: 'Latinas earn about 55 cents for every dollar white non-Hispanic men earn.', src: 'National Women’s Law Center, 2023' },
  { tags: ['gender:woman', 'skin:dark'], area: 'ai', eff: .6, text: 'Commercial face-analysis tools misclassified darker-skinned women up to 34.7% of the time, against 0.8% for lighter-skinned men.', src: 'Buolamwini & Gebru, 2018' },
  { tags: ['gender:man', 'skin:light'], area: 'ai', eff: 1.15, text: 'Lighter-skinned men had the lowest error rate in the same audit (under 1%).', src: 'Buolamwini & Gebru, 2018' },
  { tags: ['race:black'], area: 'ai', eff: .75, text: 'Five big speech-recognition systems made almost twice as many errors on Black speakers as on white speakers.', src: 'Koenecke et al., 2020' },
  { tags: ['race:black', 'gender:woman'], area: 'care', eff: .45, text: 'Black women die of pregnancy-related causes at about 2.6 times the rate of white women.', src: 'CDC, 2021 data' },
  { tags: ['race:black'], area: 'care', eff: .8, text: 'In one study, about half of white medical students and residents held false beliefs about biological differences between Black and white patients, which shaped how they rated pain.', src: 'Hoffman et al., 2016' },
  { tags: ['race:black'], area: 'loan', eff: .6, text: 'Black mortgage applicants were denied at roughly twice the rate of white applicants.', src: 'CFPB / HMDA, 2022' },
  { tags: ['race:hispanic'], area: 'loan', eff: .8, text: 'Hispanic mortgage applicants were also denied more often than white applicants.', src: 'CFPB / HMDA, 2022' },
  { tags: ['disabled'], area: 'hired', eff: .55, text: 'The unemployment rate for people with a disability is about twice the rate for people without one.', src: 'BLS, 2023' },
  { tags: ['disabled'], area: 'care', eff: .7, text: 'Only about 4 in 10 US doctors said they were very confident they could give disabled patients the same quality of care.', src: 'Iezzoni et al., 2021' },
  { tags: ['disabled'], area: null, eff: 1, text: 'Only about 1 in 5 video games let you create a character with a disability.', src: 'MSU Meaningful Play, 2016' },
  { tags: ['faith:muslim', 'gender:woman'], area: 'hired', eff: .7, text: 'In a field study, women wearing a hijab got fewer callbacks and more hostile treatment when applying for jobs.', src: 'Ghumman & Ryan, 2013' },
  { tags: ['age:60s'], area: 'hired', eff: .75, text: 'In a field experiment with 40,000 résumés, older applicants got fewer callbacks.', src: 'Neumark, Burn & Button, 2019' },
  { tags: ['age:60s', 'gender:woman'], area: 'hired', eff: .65, text: 'Age discrimination was strongest against older women in the same study.', src: 'Neumark, Burn & Button, 2019' },
  { tags: ['orient:lgbtq', 'gender:man'], area: 'hired', eff: .7, text: 'Résumés that signalled a gay man got about 40% fewer callbacks than matched résumés.', src: 'Tilcsik, 2011' },
  { tags: ['race:asian'], area: 'promoted', eff: .8, text: 'Asian Americans were the group most likely to be hired into big tech firms but the least likely to be promoted to executive.', src: 'Ascend Foundation, 2015' },
  { tags: ['race:native'], area: 'care', eff: .7, text: 'American Indian and Alaska Native life expectancy was about 11 years shorter than the US average.', src: 'CDC, 2021' },
  { tags: ['race:native'], area: 'ai', nodata: true, text: 'Most face- and speech-recognition audits don’t report Native Americans as a separate group.', src: 'reporting practice' },
  { tags: ['race:pi'], area: null, nodata: true, text: 'Pacific Islanders are often folded into “Asian” or left out of studies because the groups are small.', src: 'reporting practice' },
  { tags: ['gender:nonbinary'], area: null, nodata: true, text: 'Most federal labor surveys didn’t collect nonbinary gender until very recently.', src: 'BLS / Census practice' },
  { tags: ['skin:dark'], area: 'paid', eff: .9, text: 'Colorism: among US immigrants, darker skin went with lower wages even after controlling for education and origin.', src: 'Hersch, 2008' },
];
const matchFacts = s => { const t = tagsOf(s); return FACTS.filter(f => f.tags.every(x => t.has(x))).sort((a, b) => b.tags.length - a.tags.length); };
function areaScores(s) {
  const out = Object.fromEntries(AREAS.map(([k]) => [k, { v: 1, nodata: false }]));
  for (const f of matchFacts(s)) if (f.area) { if (f.nodata) out[f.area].nodata = true; else out[f.area].v *= f.eff; }
  return out;
}

/* ============ avatar: line art, black ink, skin tone fill ============ */
function avatar(s, shirtVar, size) {
  const ink = '#111', skin = SKINS[s.skin]; // avatar ink stays black in both themes; it sits on its own light tile
  const hair = s.age === '60s' ? '#BDBDBD' : '#111';
  const wc = s.ability.includes('wheelchair');
  const st = (fill, w = 5) => `style="fill:${fill};stroke:${ink};stroke-width:${w};stroke-linejoin:round;stroke-linecap:round"`;
  let back = '', front = '';
  if (s.faith === 'muslim') {
    back = `<path d="M46 112 Q46 36 100 36 Q154 36 154 112 L162 190 L38 190 Z" ${st('var(--hijab)')}/>`;
    front = `<path d="M58 96 Q60 48 100 48 Q140 48 142 96 Q134 70 100 68 Q66 70 58 96Z" ${st('var(--hijab)', 4)}/>`;
  } else if (s.gender === 'woman') {
    back = `<path d="M50 104 Q48 42 100 42 Q152 42 150 104 L154 170 Q100 182 46 170 Z" ${st(hair)}/>`;
    front = `<path d="M54 94 Q60 46 100 46 Q140 46 146 94 Q122 64 82 70 Q64 78 54 94Z" ${st(hair, 4)}/>`;
  } else if (s.gender === 'man') {
    front = `<path d="M54 92 Q52 42 100 42 Q148 42 146 92 Q140 66 100 64 Q60 66 54 92Z" ${st(hair, 4)}/>`;
  } else {
    front = `<path d="M54 98 Q50 42 102 42 Q150 44 148 86 Q122 58 92 74 Q68 80 54 98Z" ${st(hair, 4)}/>`;
  }
  const kippah = s.faith === 'jewish' ? `<path d="M78 50 Q100 30 122 50 Z" ${st('var(--kippah)', 4)}/>` : '';
  const lines = s.age === '60s' ? `<path d="M70 90 q7 4 14 0 M116 90 q7 4 14 0" style="fill:none;stroke:${ink};stroke-width:2.5;stroke-linecap:round"/>` : '';
  const aid = s.ability.includes('deaf') ? `<path d="M150 96 q10 8 0 18" style="fill:none;stroke:${ink};stroke-width:6;stroke-linecap:round"/>` : '';
  const eyes = s.ability.includes('blind')
    ? `<rect x="66" y="94" width="28" height="15" rx="6" style="fill:${ink}"/><rect x="106" y="94" width="28" height="15" rx="6" style="fill:${ink}"/><path d="M94 100 h12" style="stroke:${ink};stroke-width:4"/>`
    : `<circle cx="82" cy="102" r="4.5" style="fill:${ink}"/><circle cx="118" cy="102" r="4.5" style="fill:${ink}"/>`;
  const cane = s.ability.includes('blind') ? `<path d="M178 150 L196 240" style="stroke:${ink};stroke-width:5;stroke-linecap:round"/>` : '';
  const pin = s.orient === 'lgbtq' ? `<g>${['#e03131', '#f08c00', '#fab005', '#2f9e44', '#1971c2', '#7048e8'].map((c, i) => `<rect x="118" y="${192 + i * 3}" width="18" height="3" fill="${c}"/>`).join('')}<rect x="118" y="192" width="18" height="18" rx="2" style="fill:none;stroke:${ink};stroke-width:2"/></g>` : '';
  const chair = wc ? `<g style="fill:none;stroke:${ink};stroke-linecap:round"><path d="M40 208 h118" stroke-width="7"/><circle cx="70" cy="228" r="18" stroke-width="5"/><circle cx="142" cy="232" r="8" stroke-width="5"/><path d="M38 160 L40 208" stroke-width="6"/></g>` : '';
  return `<svg viewBox="20 20 170 230" width="${size}" height="${size * 230 / 170}" aria-hidden="true">
    ${back}
    <path d="M44 ${wc ? 208 : 260} Q44 166 100 160 Q156 166 156 ${wc ? 208 : 260} Z" ${st(`var(${shirtVar})`)}/>${pin}
    <path d="M88 136 L88 162 Q100 168 112 162 L112 136" ${st(skin)}/>
    <circle cx="54" cy="104" r="8" ${st(skin, 4)}/><circle cx="146" cy="104" r="8" ${st(skin, 4)}/>
    <circle cx="100" cy="100" r="46" ${st(skin)}/>
    ${front}${kippah}${eyes}${lines}${aid}
    <path d="M100 104 q-5 10 2 12" style="fill:none;stroke:${ink};stroke-width:3;stroke-linecap:round"/>
    <path d="M88 126 Q100 133 112 126" style="fill:none;stroke:${ink};stroke-width:4;stroke-linecap:round"/>${chair}${cane}
  </svg>`;
}

/* ============ state (in memory) ============ */
const S = { a: blank(), b: blank(), area: null };

/* ============ view ============ */
const icon = n => `<i data-lucide="${n}"></i>`;
const num = sc => sc.nodata ? null : Math.round(sc.v * 100);
const same = () => JSON.stringify(S.a) === JSON.stringify(S.b);

function side(key) {
  const s = S[key], other = S[key === 'a' ? 'b' : 'a'];
  const mine = tagsOf(s), theirs = tagsOf(other);
  const n = [...mine].filter(t => !theirs.has(t)).length;
  const skin = `<div class="group"><h4>Skin tone</h4><div class="opts">${SKINS.map((c, i) =>
    `<button class="swatch ${s.skin === i ? 'on' : ''}" style="background:${c}" data-side="${key}" data-k="skin" data-v="${i}" aria-label="Skin tone ${i + 1}" aria-pressed="${s.skin === i}"></button>`).join('')}</div></div>`;
  const groups = GROUPS.map(g => `<div class="group"><h4>${g.label}</h4><div class="opts">${g.opts.map(([v, l]) => {
    const on = g.multi ? s[g.key].includes(v) : s[g.key] === v;
    const unshared = mine.has(`${g.key}:${v}`) !== theirs.has(`${g.key}:${v}`);
    return `<button class="chip ${on ? 'on' : ''} ${unshared ? 'unshared' : ''}" data-side="${key}" data-k="${g.key}" data-v="${v}" aria-pressed="${on}">${l}</button>`;
  }).join('')}</div></div>`).join('');
  return `<section class="side" aria-label="${key === 'a' ? 'Left' : 'Right'} person">
    <div class="who"><div class="frame">${avatar(s, key === 'a' ? '--shirt-a' : '--shirt-b', 82)}</div>
      <div><div class="name">${key === 'a' ? 'Left' : 'Right'} person</div>
      <div class="sub">${n ? `<mark>${n}</mark> trait${n > 1 ? 's' : ''} the other doesn’t have` : 'Nothing the other doesn’t have'}</div></div></div>
    ${skin}${groups}
  </section>`;
}

function factRow(f, whoTag) {
  const area = AREAS.find(d => d[0] === f.area)?.[1] || 'Context';
  const kind = f.nodata ? 'No data' : f.tags.length > 1 ? 'Intersection' : area;
  return `<div class="fact ${f.nodata ? 'nodata' : ''}">
    <div class="meta">${whoTag ? `${whoTag} · ` : ''}${kind}${f.nodata || f.tags.length > 1 ? ` · ${area}` : ''}</div>
    <p>${f.text}</p><div class="src">${f.src} · not yet verified</div></div>`;
}

function center() {
  const sa = areaScores(S.a), sb = areaScores(S.b);
  const ma = matchFacts(S.a), mb = matchFacts(S.b);
  const fa = ma.filter(f => !mb.includes(f)), fb = mb.filter(f => !ma.includes(f));
  // selected area: the clicked one, else the one with the biggest gap
  let sel = S.area;
  if (!sel) { let best = 0; for (const [k] of AREAS) { const g = Math.abs((num(sa[k]) ?? 100) - (num(sb[k]) ?? 100)); if (g > best) { best = g; sel = k; } } }
  const why = sel ? [...fa.map(f => [f, 'Left']), ...fb.map(f => [f, 'Right'])].filter(([f]) => f.area === sel) : [];
  const selName = sel && AREAS.find(d => d[0] === sel)[1];
  const W = v => v == null ? 0 : Math.min(100, v / 1.3);
  return `<div class="center">
    <div class="areas">
      <div class="areas-head"><span>Left</span><span>Life areas</span><span>Right</span></div>
      ${AREAS.map(([k, l, ic]) => {
        const a = num(sa[k]), b = num(sb[k]);
        const d = a == null || b == null ? null : b - a;
        const dTxt = d == null ? 'no data' : d === 0 ? 'same' : `right ${d > 0 ? '+' : '−'}${Math.abs(d)}`;
        return `<button class="area ${sel === k ? 'sel' : ''}" data-area="${k}" aria-pressed="${S.area === k}">
          <span class="row1">${icon(ic)}<span class="lbl">${l}</span><span class="delta num">${d && Math.abs(d) >= 10 ? `<mark>${dTxt}</mark>` : dTxt}</span></span>
          <span class="fly"><span class="v num">${a ?? '–'}</span>
            <span class="track l ${a == null ? 'nodata' : ''}"><i style="width:${W(a)}%"></i></span>
            <span class="track r ${b == null ? 'nodata' : ''}"><i style="width:${W(b)}%"></i></span>
            <span class="v r num">${b ?? '–'}</span></span>
        </button>`;
      }).join('')}
    </div>
    <div class="why">${sel && why.length
      ? `<h4>Why “${selName}” differs</h4>${why.map(([f, w]) => factRow(f, w)).join('')}`
      : same() ? '' : '<p class="hint">Click a life area to see the facts behind it.</p>'}</div>
  </div>`;
}

function topRow() {
  return `<div class="top" style="justify-content:flex-end">
    <button class="btn" data-act="reset">${icon('rotate-ccw')}Reset</button>
  </div>`;
}

function allFacts() {
  const ma = matchFacts(S.a), mb = matchFacts(S.b);
  const fa = ma.filter(f => !mb.includes(f)), fb = mb.filter(f => !ma.includes(f));
  const col = (title, list) => `<div><h3>${title}<span class="muted num">${list.length}</span></h3>${list.map(f => factRow(f)).join('') || `<div class="empty">${same() ? 'Same traits, same facts.' : 'None.'}</div>`}</div>`;
  return `<div class="all">${col('Only the left person', fa)}${col('Only the right person', fb)}</div>`;
}

function render() {
  document.getElementById('app').innerHTML = `${topRow()}
    <div class="mirror">${side('a')}${center()}${side('b')}</div>
    ${allFacts()}
    <p class="footnote">Scores: 100 means no published gap was found for that life area. Each matching fact scales it by the gap it reports, so several traits compound. This is a prototype rule, not a statistic.</p>
    <p class="footnote">AI use: this prototype was built with help from an AI coding assistant (Claude). Facts are placeholders until the team verifies them.</p>`;
  window.lucide?.createIcons();
}

/* ============ events ============ */
function toggle(s, k, v) {
  if (k === 'skin') { s.skin = +v; return; }
  const g = GROUPS.find(g => g.key === k);
  if (g.multi) s[k] = s[k].includes(v) ? s[k].filter(x => x !== v) : [...s[k], v];
  else s[k] = s[k] === v ? (k === 'age' ? '20s' : null) : v;
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.k) toggle(S[d.side], d.k, d.v);
  else if (d.area) S.area = S.area === d.area ? null : d.area;
  else if (d.act === 'b=a') S.b = structuredClone(S.a);
  else if (d.act === 'a=b') S.a = structuredClone(S.b);
  else if (d.act === 'reset') { S.a = blank(); S.b = blank(); S.area = null; }
  else return;
  render();
});
render();
</script>
</body>
</html>
